<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PigStyle Music Loveland</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="images/pigstyle_icon.jpg">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .fullscreen-img-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        
        #mainImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .square {
            position: absolute;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="fullscreen-img-container">
        <img id="mainImage" src="images/background.png" alt="background">
    </div>

    <script>
        // Create 6 squares
        function createSquares() {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFA726', '#7E57C2'];
            const sizes = [120, 150, 180, 100, 80, 60];
            
            for (let i = 0; i < 6; i++) {
                const square = document.createElement('div');
                square.className = 'square';
                square.id = 'square' + (i + 1);
                square.style.width = sizes[i] + 'px';
                square.style.height = sizes[i] + 'px';
                square.style.backgroundColor = colors[i];
                square.textContent = (i + 1).toString();
                document.body.appendChild(square);
            }
        }

        // Position squares
        function positionSquares() {
            const squares = [];
            for (let i = 1; i <= 6; i++) {
                squares.push(document.getElementById('square' + i));
            }
            
            const viewportHeight = window.innerHeight;
            const viewportWidth = window.innerWidth;
            
            // Scale squares 1-4 to use 90% of page height with 10% total margin
            const totalMargin = viewportHeight * 0.1; // 10% total margin
            const availableHeight = viewportHeight * 0.9; // 90% for squares
            
            // Calculate total original height of squares 1-4
            const originalHeights = [120, 150, 180, 100];
            const totalOriginalHeight = originalHeights.reduce((sum, height) => sum + height, 0);
            
            // Calculate scale factor
            const scale = availableHeight / totalOriginalHeight;
            
            // Apply scale to squares 1-4
            for (let i = 0; i < 4; i++) {
                squares[i].style.width = (originalHeights[i] * scale) + 'px';
                squares[i].style.height = (originalHeights[i] * scale) + 'px';
            }
            
            // Position squares 1-4 with equal gaps (5 gaps total = 10% margin)
            const numberOfGaps = 5;
            const gapSize = totalMargin / numberOfGaps;
            
            let currentPosition = gapSize;
            for (let i = 0; i < 4; i++) {
                squares[i].style.top = currentPosition + 'px';
                squares[i].style.left = '50%';
                squares[i].style.transform = 'translateX(-50%)';
                currentPosition += squares[i].offsetHeight + gapSize;
            }
            
            // Position square 5 at bottom-left
            squares[4].style.left = '20px';
            squares[4].style.bottom = '20px';
            squares[4].style.transform = 'none';
            
            // Position square 6 diagonally right above square 5
            squares[5].style.left = (20 + squares[4].offsetWidth + 10) + 'px';
            squares[5].style.bottom = (20 + squares[4].offsetHeight + 10) + 'px';
            squares[5].style.transform = 'none';
        }

        // Initialize
        function init() {
            createSquares();
            positionSquares();
        }

        // Handle resize
        window.addEventListener('resize', positionSquares);

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
