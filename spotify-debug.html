<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="icon" type="image/jpeg" href="images/pigstyle_icon.png">
    <title>PigStyle Radio - Debug Connection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            padding: 20px;
            margin: 0;
        }
        
        .debug-panel {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            border: 1px solid #333;
        }
        
        h1 {
            color: #1DB954;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }
        
        button {
            background: #1DB954;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #1ED760;
        }
        
        .log-area {
            background: #000;
            color: #0f0;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 14px;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .status.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #f00;
            color: #f00;
        }
        
        .status.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            color: #0f0;
        }
        
        .status.info {
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid #09f;
            color: #09f;
        }
        
        .config-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="debug-panel">
        <h1>🐷 PigStyle Spotify Connection Debug</h1>
        
        <div class="config-info">
            <strong>Current Configuration:</strong><br>
            Client ID: da8e176ee08048239128dc555716a7a0<br>
            Current URL: <span id="currentUrl"></span><br>
            Has Hash: <span id="hasHash"></span>
        </div>
        
        <div id="statusArea"></div>
        
        <div class="test-buttons">
            <button onclick="testRedirectURI('https://pigstylemusic.com/streaming-spotify.html')">
                Test: streaming-spotify.html
            </button>
            <button onclick="testRedirectURI('https://pigstylemusic.com/')">
                Test: Root URL
            </button>
            <button onclick="testRedirectURI('https://pigstylemusic.com/streaming-spotify.html#')">
                Test: With #
            </button>
            <button onclick="testDirectLink()">
                Open Direct Link
            </button>
            <button onclick="clearLogs()">
                Clear Logs
            </button>
        </div>
        
        <div class="log-area" id="logArea">
            Ready for testing...
        </div>
    </div>

    <script>
        const CLIENT_ID = 'da8e176ee08048239128dc555716a7a0';
        const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing user-read-email streaming';
        
        let logs = [];
        
        // Initialize
        function initialize() {
            document.getElementById('currentUrl').textContent = window.location.href;
            document.getElementById('hasHash').textContent = window.location.hash ? 'Yes: ' + window.location.hash : 'No';
            
            // Check URL for Spotify response
            checkURLForSpotifyResponse();
            
            log('Debug panel initialized', 'info');
            log('Client ID: ' + CLIENT_ID, 'info');
            log('Current URL: ' + window.location.href, 'info');
        }
        
        // Test a specific redirect URI
        function testRedirectURI(redirectUri) {
            log(`Testing redirect URI: ${redirectUri}`, 'info');
            
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(SCOPES)}&show_dialog=true`;
            
            log(`Opening URL: ${authUrl}`, 'info');
            
            // Open in new tab with a name so we can track it
            const newTab = window.open(authUrl, 'spotify_auth_' + Date.now());
            
            if (!newTab) {
                log('ERROR: Popup blocked! Please allow popups for this site.', 'error');
                showStatus('Popup blocked! Please allow popups.', 'error');
            } else {
                log('Opened authentication in new tab', 'success');
                showStatus('Opened Spotify auth in new tab. Check the new window.', 'info');
                
                // Monitor the new tab
                monitorNewTab(newTab, redirectUri);
            }
        }
        
        // Test direct link (shows URL)
        function testDirectLink() {
            const redirectUri = 'https://pigstylemusic.com/streaming-spotify.html';
            const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(SCOPES)}&show_dialog=true`;
            
            log('Direct link to copy/paste:', 'info');
            log(authUrl, 'info');
            
            // Copy to clipboard
            navigator.clipboard.writeText(authUrl).then(() => {
                showStatus('URL copied to clipboard! Paste it in a new browser window.', 'success');
            }).catch(err => {
                showStatus('Failed to copy URL. Manually copy from logs.', 'error');
            });
        }
        
        // Monitor new tab for completion
        function monitorNewTab(newTab, expectedRedirectUri) {
            let checks = 0;
            const maxChecks = 60; // Check for 60 seconds
            
            const checkInterval = setInterval(() => {
                checks++;
                
                try {
                    if (newTab.closed) {
                        clearInterval(checkInterval);
                        log('Auth tab was closed by user', 'info');
                        showStatus('Authentication tab was closed.', 'info');
                        return;
                    }
                    
                    // Check if tab has redirected back to our site
                    if (newTab.location.href.includes('pigstylemusic.com')) {
                        clearInterval(checkInterval);
                        log(`Tab redirected to: ${newTab.location.href}`, 'success');
                        showStatus('Successfully redirected back!', 'success');
                        
                        // Check for access token
                        if (newTab.location.hash.includes('access_token')) {
                            log('Found access token in URL!', 'success');
                            showStatus('Authentication SUCCESSFUL!', 'success');
                            
                            // Close the tab after a moment
                            setTimeout(() => {
                                newTab.close();
                                log('Closed auth tab', 'info');
                            }, 2000);
                        }
                    }
                } catch (e) {
                    // Cross-origin error means tab is still on Spotify
                    if (checks >= maxChecks) {
                        clearInterval(checkInterval);
                        log('Timeout: Tab still on Spotify after 60 seconds', 'error');
                        showStatus('Timeout: Authentication taking too long.', 'error');
                    }
                }
            }, 1000);
        }
        
        // Check current URL for Spotify response
        function checkURLForSpotifyResponse() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;
            
            const params = new URLSearchParams(hash);
            
            if (params.has('access_token')) {
                const token = params.get('access_token');
                log(`SUCCESS: Got access token!`, 'success');
                log(`Token (first 20 chars): ${token.substring(0, 20)}...`, 'success');
                log(`Expires in: ${params.get('expires_in')} seconds`, 'success');
                
                showStatus('🎉 SUCCESS! Authentication worked!', 'success');
                
                // Store token
                localStorage.setItem('spotify_access_token', token);
                localStorage.setItem('spotify_token_expiry', Date.now() + (parseInt(params.get('expires_in')) * 1000));
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
                
            } else if (params.has('error')) {
                const error = params.get('error');
                const errorDesc = params.get('error_description');
                
                log(`ERROR from Spotify: ${error}`, 'error');
                log(`Description: ${errorDesc}`, 'error');
                
                showStatus(`Error: ${error} - ${errorDesc}`, 'error');
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }
        
        // Log messages
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            logs.push({message: logEntry, type});
            
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = logEntry;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // Show status message
        function showStatus(message, type = 'info') {
            const statusArea = document.getElementById('statusArea');
            const status = document.createElement('div');
            status.className = `status ${type}`;
            status.textContent = message;
            statusArea.appendChild(status);
            
            // Keep only last 3 status messages
            const children = statusArea.children;
            if (children.length > 3) {
                statusArea.removeChild(children[0]);
            }
        }
        
        // Clear logs
        function clearLogs() {
            logs = [];
            document.getElementById('logArea').innerHTML = '';
            document.getElementById('statusArea').innerHTML = '';
            log('Logs cleared', 'info');
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
