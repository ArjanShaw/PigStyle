<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PigStyle Records - Streaming</title>
    <link rel="stylesheet" href="streaming.css">
    <style>
        /* Voting styles */
        .record {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            background: white;
        }

        .voting-section {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .vote-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .upvote-btn, .downvote-btn {
            padding: 8px 16px;
            border: 2px solid #333;
            background: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .upvote-btn:hover {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .downvote-btn:hover {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .vote-feedback {
            margin-top: 5px;
            padding: 5px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .vote-feedback.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .vote-feedback.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .vote-display {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        /* Main streaming styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .record-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .record-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .record-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .record-info h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1.3em;
        }

        .record-info p {
            margin: 5px 0;
            color: #666;
            font-size: 0.9em;
        }

        .record-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.8em;
            color: #888;
        }

        .now-playing {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            display: none;
        }

        .now-playing.active {
            display: block;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-box button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .genre-filters {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .genre-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .genre-btn.active {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 PigStyle Records</h1>
            <p>Stream and rate our vinyl collection</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search artists, titles, or genres...">
                <button onclick="searchRecords()">🔍 Search</button>
            </div>
            <div class="genre-filters" id="genreFilters">
                <!-- Genre filters will be populated by JavaScript -->
            </div>
        </div>

        <div class="records-grid" id="recordsGrid">
            <div class="loading">Loading records...</div>
        </div>
    </div>

    <div class="now-playing" id="nowPlaying">
        <div class="player-controls">
            <span id="currentTrack">Select a track to play</span>
            <button class="play-btn" onclick="stopPlayback()">⏹️ Stop</button>
        </div>
    </div>

    <!-- Include the voting JavaScript -->
    <script src="js/voting.js"></script>
    
    <script>
        let allRecords = [];
        let currentAudio = null;
        let currentRecord = null;

        // Load records from gallery-data.json
        async function loadRecords() {
            try {
                const response = await fetch('gallery-data.json');
                const data = await response.json();
                allRecords = data.records || [];
                displayRecords(allRecords);
                populateGenreFilters(allRecords);
                
                // Initialize voting system after records are loaded
                if (window.pigstyleVoting) {
                    window.pigstyleVoting.init();
                    // Load vote counts for all displayed records
                    allRecords.forEach(record => {
                        const artistTitle = `${record.artist} - ${record.title}`;
                        window.pigstyleVoting.loadVoteCountsForRecord(artistTitle);
                    });
                }
            } catch (error) {
                console.error('Error loading records:', error);
                document.getElementById('recordsGrid').innerHTML = 
                    '<div class="no-results">Error loading records. Please try again later.</div>';
            }
        }

        // Display records in the grid
        function displayRecords(records) {
            const grid = document.getElementById('recordsGrid');
            
            if (records.length === 0) {
                grid.innerHTML = '<div class="no-results">No records found matching your search.</div>';
                return;
            }

            grid.innerHTML = records.map(record => `
                <div class="record-card" data-artist-title="${record.artist} - ${record.title}">
                    ${record.image_url ? `<img src="${record.image_url}" alt="${record.title}" class="record-image" onerror="this.style.display='none'">` : ''}
                    
                    <div class="record-info">
                        <h3>${record.artist} - ${record.title}</h3>
                        ${record.genre ? `<p><strong>Genre:</strong> ${record.genre}</p>` : ''}
                        ${record.format ? `<p><strong>Format:</strong> ${record.format}</p>` : ''}
                        ${record.catalog_number ? `<p><strong>Catalog:</strong> ${record.catalog_number}</p>` : ''}
                        
                        ${record.youtube_url ? `
                            <div style="margin: 15px 0;">
                                <button class="play-btn" onclick="playRecord('${record.youtube_url}', '${record.artist}', '${record.title}')">
                                    ▶️ Play Album
                                </button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="voting-section">
                        <h4>Rate This Record</h4>
                        <div class="vote-buttons">
                            <button class="upvote-btn" data-artist-title="${record.artist} - ${record.title}">
                                👍 <span class="upvote-count">0</span>
                            </button>
                            <button class="downvote-btn" data-artist-title="${record.artist} - ${record.title}">
                                👎 <span class="downvote-count">0</span>
                            </button>
                        </div>
                        <div class="vote-display">
                            Current: <span class="upvote-count">0</span> 👍 | <span class="downvote-count">0</span> 👎
                        </div>
                    </div>

                    <div class="record-meta">
                        ${record.barcode ? `<span>Barcode: ${record.barcode}</span>` : ''}
                        ${record.file_at ? `<span>Location: ${record.file_at}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Populate genre filters
        function populateGenreFilters(records) {
            const genres = [...new Set(records.map(record => record.genre).filter(Boolean))].sort();
            const filtersContainer = document.getElementById('genreFilters');
            
            filtersContainer.innerHTML = `
                <button class="genre-btn active" onclick="filterByGenre('all')">All Genres</button>
                ${genres.map(genre => `
                    <button class="genre-btn" onclick="filterByGenre('${genre}')">${genre}</button>
                `).join('')}
            `;
        }

        // Filter records by genre
        function filterByGenre(genre) {
            // Update active button
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            if (genre === 'all') {
                displayRecords(allRecords);
            } else {
                const filteredRecords = allRecords.filter(record => record.genre === genre);
                displayRecords(filteredRecords);
            }
        }

        // Search records
        function searchRecords() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                displayRecords(allRecords);
                return;
            }

            const filteredRecords = allRecords.filter(record => 
                record.artist.toLowerCase().includes(searchTerm) ||
                record.title.toLowerCase().includes(searchTerm) ||
                (record.genre && record.genre.toLowerCase().includes(searchTerm)) ||
                (record.catalog_number && record.catalog_number.toLowerCase().includes(searchTerm))
            );

            displayRecords(filteredRecords);
        }

        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchRecords();
            }
        });

        // Play record audio
        function playRecord(youtubeUrl, artist, title) {
            stopPlayback(); // Stop any currently playing audio
            
            // Extract YouTube video ID
            const videoId = extractYouTubeId(youtubeUrl);
            if (!videoId) {
                alert('Invalid YouTube URL');
                return;
            }

            // For now, we'll just show the track info
            // In a real implementation, you'd embed the YouTube player or use audio API
            const nowPlaying = document.getElementById('nowPlaying');
            const currentTrack = document.getElementById('currentTrack');
            
            currentTrack.textContent = `Now Playing: ${artist} - ${title}`;
            nowPlaying.classList.add('active');
            
            currentRecord = { artist, title, youtubeUrl };
            
            // You would integrate with YouTube IFrame API here
            console.log('Would play:', youtubeUrl);
        }

        // Stop playback
        function stopPlayback() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            
            const nowPlaying = document.getElementById('nowPlaying');
            nowPlaying.classList.remove('active');
            currentRecord = null;
        }

        // Extract YouTube ID from URL
        function extractYouTubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?]+)/,
                /youtube\.com\/embed\/([^&\n?]+)/,
                /youtube\.com\/v\/([^&\n?]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadRecords();
            
            // Initialize voting system
            if (!window.pigstyleVoting) {
                window.pigstyleVoting = new VotingSystem();
            }
        });
    </script>
</body>
</html>
