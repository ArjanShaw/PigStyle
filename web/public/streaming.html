<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="icon" type="image/jpeg" href="images/pigstyle_icon.jpg">
    <title>Streaming Station - PigStyle Records</title>
    <link rel="stylesheet" href="streaming.css">
</head>
<body>
    <!-- Background Image -->
    <div class="background-container">
        <img src="images/background.png" alt="Background" class="background-image">
        <div class="background-overlay"></div>
    </div>

    <header>
        <div class="logo-container">
            <a href='index.html'><img src='images/pigstyle_text.png' alt='PigStyle'></a>
        </div>
        <div class="genre-selector">
            <select id="genreFilter" class="genre-select">
                <option value="">All Genres</option>
            </select>
        </div>
    </header>
     
    <div class="player-container">
        <div id="loading" class="loading">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p>Loading streaming station...</p>
        </div>
        
        <div id="playerContent" style="display: none;">
            <div class="current-track">
                <h2 id="trackTitle">Track Title</h2>
                <p class="artist" id="trackArtist">Artist Name</p>
                <div class="price-badge" id="trackPrice">$0.00</div>
                <div class="details">
                    <div class="detail-item format" id="trackFormat">Format</div>
                    <div class="detail-item condition" id="trackCondition">Condition</div>
                    <div class="detail-item genre" id="trackGenre">Genre</div>
                </div>
                
                <!-- Updated Vote controls -->
                <div class="vote-controls">
                    <button class="vote-btn upvote" id="upvoteBtn" title="Upvote">
                        👍
                        <span class="vote-count-badge" id="upvoteCount">0</span>
                    </button>
                    <button class="vote-btn downvote" id="downvoteBtn" title="Downvote">
                        👎
                        <span class="vote-count-badge" id="downvoteCount">0</span>
                    </button>
                </div>
            </div>
            
            <div class="video-container" id="videoContainer">
                <div class="record-image-overlay" id="recordImageOverlay"></div>
                <div id="youtube-player"></div>
            </div>
            
            <div class="nav-controls">
                <button class="nav-btn" id="prevBtn">◀</button>
                <button class="nav-btn" id="nextBtn">▶</button>
            </div>
        </div>
    </div>

    <script>
        // Store all records and filtered records
        let allRecords = [];
        let filteredRecords = [];
        let currentTrackIndex = 0;
        let youtubePlayer = null;
        let autoplayEnabled = true;
        let userIP = null;
        let votesData = {};
        let currentTrackId = null;

        // Load data from gallery-data.json
        async function loadStreamingData() {
            try {
                console.log('Loading streaming data...');
                
                // Get user IP first
                await getUserIP();
                
                // Load votes data
                await loadVotesData();
                
                const response = await fetch('gallery-data.json');
                const data = await response.json();
                
                // Handle both data structures:
                if (data && data.records && Array.isArray(data.records)) {
                    allRecords = data.records;
                } else if (Array.isArray(data)) {
                    allRecords = data;
                } else {
                    console.error('Unexpected data structure:', data);
                    allRecords = [];
                }
                
                // Filter records to only those with YouTube videos
                filteredRecords = allRecords.filter(record => {
                    return extractYouTubeId(record.youtube_url) !== null;
                });
                
                console.log(`Loaded ${filteredRecords.length} streamable records`);
                
                if (filteredRecords.length === 0) {
                    document.getElementById('loading').innerHTML = '<div class="error-message">No streamable records found in the database.</div>';
                    return;
                }
                
                // RANDOMIZE THE VIDEO ORDER
                shuffleArray(filteredRecords);
                console.log('Randomized video order:', filteredRecords.map(r => r.title));
                
                populateGenreFilter();
                initializePlayer();
                
            } catch (error) {
                console.error('Error loading streaming data:', error);
                document.getElementById('loading').innerHTML = '<div class="error-message">Error loading streaming station. Please try again later.</div>';
            }
        }

        // Get user IP address
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
                console.log('User IP:', userIP);
            } catch (error) {
                console.error('Error getting IP:', error);
                // Fallback to a random identifier if IP fetch fails
                userIP = 'unknown_' + Math.random().toString(36).substr(2, 9);
            }
        }

        // Load votes data from local JSON file
        async function loadVotesData() {
            try {
                const response = await fetch('votes-data.json');
                votesData = await response.json();
                console.log('Loaded votes data:', votesData);
            } catch (error) {
                console.log('No existing votes data found, starting fresh');
                votesData = {
                    tracks: {},
                    lastUpdated: new Date().toISOString()
                };
            }
        }

        // Save votes data to local JSON file
        async function saveVotesData() {
            try {
                votesData.lastUpdated = new Date().toISOString();
                // In a real implementation, you'd send this to a server endpoint
                // For now, we'll just store it in memory and log it
                console.log('Votes data to save:', votesData);
                
                // For client-side storage, we could use localStorage as a fallback
                localStorage.setItem('pigstyle_votes_data', JSON.stringify(votesData));
            } catch (error) {
                console.error('Error saving votes data:', error);
            }
        }

        // Fisher-Yates shuffle algorithm to randomize array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Populate genre filter dropdown
        function populateGenreFilter() {
            const genreFilter = document.getElementById('genreFilter');
            const genres = [...new Set(filteredRecords.map(record => record.genre))].sort();
            
            genres.forEach(genre => {
                const option = document.createElement('option');
                option.value = genre;
                option.textContent = genre;
                genreFilter.appendChild(option);
            });
            
            // Add event listener for genre filter
            genreFilter.addEventListener('change', function() {
                applyGenreFilter(this.value);
            });
        }

        // Apply genre filter
        function applyGenreFilter(genre) {
            let filteredByYouTube = allRecords.filter(record => extractYouTubeId(record.youtube_url) !== null);
            
            if (!genre) {
                filteredRecords = filteredByYouTube;
            } else {
                filteredRecords = filteredByYouTube.filter(record => record.genre === genre);
            }
            
            // RANDOMIZE THE FILTERED RESULTS
            shuffleArray(filteredRecords);
            
            if (filteredRecords.length === 0) {
                // If no records after filtering, show message and stop player
                document.getElementById('playerContent').style.display = 'none';
                document.getElementById('loading').innerHTML = '<div class="error-message">No records found for this genre.</div>';
                return;
            }
            
            // Reset to first track and start playing
            currentTrackIndex = 0;
            loadCurrentTrack();
        }

        // Initialize the player
        function initializePlayer() {
            // Hide loading, show player
            document.getElementById('loading').style.display = 'none';
            document.getElementById('playerContent').style.display = 'block';
            
            // Load YouTube API and first track
            loadYouTubeAPI();
            
            // Add event listeners for navigation
            document.getElementById('prevBtn').addEventListener('click', playPreviousTrack);
            document.getElementById('nextBtn').addEventListener('click', playNextTrack);
            
            // Add event listeners for voting
            document.getElementById('upvoteBtn').addEventListener('click', () => handleVote('upvote'));
            document.getElementById('downvoteBtn').addEventListener('click', () => handleVote('downvote'));
        }

        // Load YouTube API
        function loadYouTubeAPI() {
            // Load YouTube IFrame API
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            
            // This function will be called by YouTube API when ready
            window.onYouTubeIframeAPIReady = function() {
                loadCurrentTrack();
            };
        }

        // Load current track
        function loadCurrentTrack() {
            if (filteredRecords.length === 0) return;
            
            const currentRecord = filteredRecords[currentTrackIndex];
            const youtubeId = extractYouTubeId(currentRecord.youtube_url);
            currentTrackId = currentRecord.id.toString();
            
            // Update track info
            document.getElementById('trackTitle').textContent = currentRecord.title || 'Unknown Title';
            document.getElementById('trackArtist').textContent = currentRecord.artist || 'Unknown Artist';
            
            // Update format
            const format = currentRecord.format || 'Unknown Format';
            document.getElementById('trackFormat').textContent = format;
            
            // Update condition (show as X/5)
            const condition = currentRecord.condition || '5';
            document.getElementById('trackCondition').textContent = `${condition}/5 Condition`;
            
            // Update genre
            document.getElementById('trackGenre').textContent = currentRecord.genre || 'Unknown Genre';
            
            // Update price
            const price = currentRecord.store_price ? `$${parseFloat(currentRecord.store_price).toFixed(2)}` : 'Price N/A';
            document.getElementById('trackPrice').textContent = price;
            
            // Update vote display
            updateVoteDisplay();
            
            // Set record image as overlay
            const recordImageUrl = currentRecord.image_url || 'images/default-record.jpg';
            document.getElementById('recordImageOverlay').style.backgroundImage = `url('${recordImageUrl}')`;
            
            // Reset video container class
            document.getElementById('videoContainer').classList.remove('video-playing');
            
            // Create or update YouTube player
            if (!youtubePlayer) {
                youtubePlayer = new YT.Player('youtube-player', {
                    height: '100%',
                    width: '100%',
                    videoId: youtubeId,
                    playerVars: {
                        'autoplay': autoplayEnabled ? 1 : 0,
                        'controls': 1,
                        'rel': 0,
                        'modestbranding': 1,
                        'cc_load_policy': 0, // Disable captions by default
                        'iv_load_policy': 3  // Disable annotations
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            } else {
                youtubePlayer.loadVideoById(youtubeId);
                if (autoplayEnabled) {
                    youtubePlayer.playVideo();
                }
            }
        }

        // Update vote display for current track
        function updateVoteDisplay() {
            if (!votesData.tracks[currentTrackId]) {
                votesData.tracks[currentTrackId] = {
                    upvotes: 0,
                    downvotes: 0,
                    voters: {}
                };
            }
            
            const trackVotes = votesData.tracks[currentTrackId];
            
            // Update badge counts
            document.getElementById('upvoteCount').textContent = trackVotes.upvotes;
            document.getElementById('downvoteCount').textContent = trackVotes.downvotes;
            
            // Update button states based on user's previous vote
            const upvoteBtn = document.getElementById('upvoteBtn');
            const downvoteBtn = document.getElementById('downvoteBtn');
            
            upvoteBtn.classList.remove('voted');
            downvoteBtn.classList.remove('voted');
            
            if (trackVotes.voters[userIP] === 'upvote') {
                upvoteBtn.classList.add('voted');
            } else if (trackVotes.voters[userIP] === 'downvote') {
                downvoteBtn.classList.add('voted');
            }
        }

        // Handle vote action
        function handleVote(voteType) {
            if (!currentTrackId || !userIP) return;
            
            if (!votesData.tracks[currentTrackId]) {
                votesData.tracks[currentTrackId] = {
                    upvotes: 0,
                    downvotes: 0,
                    voters: {}
                };
            }
            
            const trackVotes = votesData.tracks[currentTrackId];
            const previousVote = trackVotes.voters[userIP];
            
            // If user already voted this way, remove the vote
            if (previousVote === voteType) {
                if (voteType === 'upvote') {
                    trackVotes.upvotes--;
                } else {
                    trackVotes.downvotes--;
                }
                delete trackVotes.voters[userIP];
            } else {
                // If user voted differently before, remove previous vote
                if (previousVote === 'upvote') {
                    trackVotes.upvotes--;
                } else if (previousVote === 'downvote') {
                    trackVotes.downvotes--;
                }
                
                // Add new vote
                if (voteType === 'upvote') {
                    trackVotes.upvotes++;
                } else {
                    trackVotes.downvotes++;
                }
                trackVotes.voters[userIP] = voteType;
            }
            
            // Update display and save data
            updateVoteDisplay();
            saveVotesData();
        }

        // YouTube player ready callback
        function onPlayerReady(event) {
            console.log('YouTube player ready');
            if (autoplayEnabled) {
                event.target.playVideo();
            }
        }

        // YouTube player state change callback
        function onPlayerStateChange(event) {
            // When video starts playing, hide the record image overlay
            if (event.data === YT.PlayerState.PLAYING) {
                document.getElementById('videoContainer').classList.add('video-playing');
            }
            // When video ends, play next track
            if (event.data === YT.PlayerState.ENDED) {
                playNextTrack();
            }
        }

        // Play previous track
        function playPreviousTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + filteredRecords.length) % filteredRecords.length;
            loadCurrentTrack();
        }

        // Play next track
        function playNextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % filteredRecords.length;
            loadCurrentTrack();
        }

        // Extract YouTube video ID from URL
        function extractYouTubeId(url) {
            if (!url) return null;
            
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?]+)/,
                /youtube\.com\/embed\/([^&\n?]+)/,
                /youtube\.com\/v\/([^&\n?]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return match[1];
                }
            }
            return null;
        }

        // Load the streaming data when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadStreamingData();
        });
    </script>
</body>
</html>
