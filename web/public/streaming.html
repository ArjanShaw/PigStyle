<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PigStyle Records - Streaming</title>
    <link rel="stylesheet" href="streaming.css">
    <style>
        /* Voting styles */
        .vote-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .upvote-btn, .downvote-btn {
            padding: 8px 16px;
            border: 2px solid #333;
            background: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .upvote-btn:hover {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .downvote-btn:hover {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .vote-feedback {
            margin-top: 5px;
            padding: 5px;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .vote-feedback.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .vote-feedback.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .vote-display {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PigStyle Records Streaming</h1>
            <p>Listen and vote on our collection</p>
        </header>

        <main>
            <section class="player-section">
                <div class="now-playing">
                    <h3>Now Playing</h3>
                    <div id="currentTrack">No track selected</div>
                    <audio id="audioPlayer" controls></audio>
                </div>
            </section>

            <section class="catalog-section">
                <h2>Record Catalog</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search records...">
                    <button onclick="searchRecords()">Search</button>
                </div>
                
                <div class="records-grid" id="recordsGrid">
                    <!-- Records will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Include the voting JavaScript -->
    <script src="js/voting.js"></script>
    
    <script>
        let allRecords = [];
        let currentAudio = null;

        // Load records from gallery-data.json
        async function loadRecords() {
            try {
                const response = await fetch('gallery-data.json');
                const data = await response.json();
                allRecords = data.records || [];
                displayRecords(allRecords);
                
                // Initialize voting system after records are loaded
                if (window.pigstyleVoting) {
                    window.pigstyleVoting.init();
                }
            } catch (error) {
                console.error('Error loading records:', error);
                document.getElementById('recordsGrid').innerHTML = 
                    '<div class="error">Error loading records. Please try again later.</div>';
            }
        }

        // Display records in the grid
        function displayRecords(records) {
            const grid = document.getElementById('recordsGrid');
            
            if (records.length === 0) {
                grid.innerHTML = '<div class="no-results">No records found.</div>';
                return;
            }

            grid.innerHTML = records.map(record => {
                const artistTitle = `${record.artist} - ${record.title}`;
                return `
                    <div class="record-card" data-artist-title="${artistTitle}">
                        <div class="record-image">
                            ${record.image_url ? `<img src="${record.image_url}" alt="${record.title}" onerror="this.style.display='none'">` : ''}
                        </div>
                        <div class="record-info">
                            <h3>${record.artist}</h3>
                            <h4>${record.title}</h4>
                            ${record.genre ? `<p class="genre">${record.genre}</p>` : ''}
                            ${record.format ? `<p class="format">${record.format}</p>` : ''}
                            
                            ${record.youtube_url ? `
                                <button class="play-btn" onclick="playTrack('${record.youtube_url}', '${record.artist}', '${record.title}')">
                                    Play
                                </button>
                            ` : ''}
                            
                            <div class="voting-section">
                                <div class="vote-buttons">
                                    <button class="upvote-btn" data-artist-title="${artistTitle}">
                                        👍 <span class="upvote-count">0</span>
                                    </button>
                                    <button class="downvote-btn" data-artist-title="${artistTitle}">
                                        👎 <span class="downvote-count">0</span>
                                    </button>
                                </div>
                                <div class="vote-display">
                                    Votes: <span class="upvote-count">0</span> 👍 | <span class="downvote-count">0</span> 👎
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search records
        function searchRecords() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!searchTerm) {
                displayRecords(allRecords);
                return;
            }

            const filteredRecords = allRecords.filter(record => 
                record.artist.toLowerCase().includes(searchTerm) ||
                record.title.toLowerCase().includes(searchTerm) ||
                (record.genre && record.genre.toLowerCase().includes(searchTerm))
            );

            displayRecords(filteredRecords);
        }

        // Play track
        function playTrack(youtubeUrl, artist, title) {
            // Stop any currently playing audio
            if (currentAudio) {
                currentAudio.pause();
            }
            
            // For YouTube integration, you would use the YouTube IFrame API
            // This is a basic implementation that just shows the track info
            document.getElementById('currentTrack').textContent = `${artist} - ${title}`;
            
            // In a real implementation, you would:
            // 1. Extract YouTube video ID from the URL
            // 2. Load the YouTube IFrame Player
            // 3. Play the video/audio
            
            console.log('Would play:', youtubeUrl);
        }

        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchRecords();
            }
        });

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadRecords();
            
            // Initialize voting system
            if (!window.pigstyleVoting) {
                window.pigstyleVoting = new VotingSystem();
            }
        });
    </script>
</body>
</html>
