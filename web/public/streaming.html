<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="icon" type="image/jpeg" href="images/pigstyle_icon.png">
    <title>Streaming Station - PigStyle Records</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03HFDR9PV7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-03HFDR9PV7');
    </script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="streaming.css">
    <!-- External JavaScript -->
    <script src="streaming.js"></script>
</head>
<body>
    <!-- Background Image -->
    <div class="background-container">
        <img src="images/background.png" alt="Background" class="background-image">
        <div class="background-overlay"></div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo-container">
                <a href='index.html'><img src='images/pigstyle_icon.png' alt='PigStyle'></a>
            </div>
            <div class="service-icons">
                <div class="service-icon youtube-icon active" id="youtubeIcon" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="service-icon spotify-icon" id="spotifyIcon" title="Spotify">
                    <i class="fab fa-spotify"></i>
                </div>
            </div>
            <div class="genre-selector">
                <select id="genreFilter" class="genre-select">
                    <option value="">All Genres</option>
                </select>
            </div>
        </div>
    </header>
     
    <div class="player-container">
        <div id="loading" class="loading">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p id="loadingMessage">Loading streaming station...</p>
        </div>
        
        <div id="playerContent" style="display: none;">
            <div class="current-track">
                <h2 id="trackTitle">PigStyle Records Collection</h2>
                <p class="artist" id="trackArtist">Various Artists</p>
                <div class="price-container">
                    <div class="price-badge" id="trackPrice">Stream Now</div>
                    <div class="info-badges">
                        <!-- Vote info display -->
                        <div class="vote-info">
                            <div class="votes-count" id="votesCount">0</div>
                            <div class="playlist-status active" id="playlistStatus">✅ In Playlists</div>
                        </div>
                    </div>
                </div>
                
                <!-- Vote controls -->
                <div class="vote-controls" id="voteControls" style="display: none;">
                    <button class="vote-btn upvote" id="upvoteBtn" title="Upvote">
                        👍
                    </button>
                    <button class="vote-btn downvote" id="downvoteBtn" title="Downvote">
                        👎
                    </button>
                    <button class="vote-btn kill" id="killBtn" title="Remove from Playlists">
                        ⚡
                    </button>
                </div>
            </div>
            
            <!-- Spotify Player Container -->
            <div class="spotify-container" id="spotifyContainer" style="display: none;">
                <iframe id="spotifyPlaylistEmbed" 
                        width="100%" 
                        height="380" 
                        frameborder="0" 
                        allowfullscreen="" 
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                        loading="lazy">
                </iframe>
            </div>
            
            <!-- YouTube Player Container -->
            <div class="video-container" id="youtubeContainer" style="display: none;">
                <div id="youtube-player" style="width: 100%; height: 100%;"></div>
            </div>
            
            <div class="spotify-controls" id="spotifyControls" style="display: none;">
                 
            </div>
            
            <div class="nav-controls" id="youtubeControls" style="display: none;">
                <button class="nav-btn" id="prevBtn">◀</button>
                <button class="nav-btn" id="nextBtn">▶</button>
            </div>
        </div>
    </div>
</body>
</html>
