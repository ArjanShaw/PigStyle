<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.25'>
    <link rel="icon" href="images/PigStyle.ico">
    <title>Streaming Station - PigStyle Records</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03HFDR9PV7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-03HFDR9PV7');
    </script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="streaming.css">
    <!-- External JavaScript -->
    <script src="streaming.js"></script>
</head>
<body>
    <!-- Background Image -->
    <div class="background-container">
        <img src="images/background.png" alt="Background" class="background-image">
        <div class="background-overlay"></div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo-container">
                <a href='index.html'><img src='images/PigStyle.ico' alt='PigStyle'></a>
            </div>
            <div class="genre-selector">
                <select id="genreFilter" class="genre-select">
                    <option value="">All Genres</option>
                </select>
            </div>
        </div>
    </header>
     
    <div class="player-container">
        <div id="loading" class="loading">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p id="loadingMessage">Loading streaming station...</p>
        </div>
        
        <div id="playerContent" style="display: none;">
            <div class="current-track">
                <h2 id="trackTitle">PigStyle Records Collection</h2>
                <p class="artist" id="trackArtist">Various Artists</p>
                <p class="price" id="trackPrice">$0.00</p>
                
                <!-- Combined controls row -->
                <div class="controls-row" id="controlsRow" style="display: none;">
                    <!-- Vote controls -->
                    <div class="vote-controls">
                        <div class="vote-stats">
                            <div class="vote-icons">
                                <button class="vote-btn upvote-btn" id="upvoteBtn" title="Upvote">
                                    <i class="fas fa-thumbs-up"></i>
                                </button>
                                <button class="vote-btn downvote-btn" id="downvoteBtn" title="Downvote">
                                    <i class="fas fa-thumbs-down"></i>
                                </button>
                                <button class="vote-btn kill-btn" id="killBtn" title="Remove from Playlists">
                                    <i class="fas fa-bolt"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Visualizer controls -->
                    <div class="visualizer-controls" id="visualizerControls">
                        <button class="control-btn stop-btn" id="stopBtn" title="Stop/Play">
                            <i class="fas fa-stop"></i>
                        </button>
                        <button class="control-btn mute-btn" id="muteBtn" title="Mute">
                            <i class="fas fa-volume-mute"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- YouTube Player Container -->
            <div class="video-container" id="youtubeContainer" style="display: none;">
                <div id="youtube-player" style="width: 100%; height: 100%;"></div>
            </div>
            
            <div class="nav-controls" id="youtubeControls" style="display: none;">
                <button class="nav-btn" id="prevBtn">◀</button>
                <button class="nav-btn" id="nextBtn">▶</button>
            </div>
        </div>
    </div>
    
    <!-- Scale Controls -->
    <div class="scale-controls">
        <button class="scale-btn" onclick="scaleDown()">-</button>
        <span style="color:white; padding: 0 10px;" id="scalePercent">100%</span>
        <button class="scale-btn" onclick="scaleUp()">+</button>
        <button class="scale-btn" onclick="resetScale()">↺</button>
    </div>
</body>
</html>
